name: Verify tools and publish workbench
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: audio-workbench-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tools:
    name: Python and JavaScript / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Run PowerShell Windows-audio tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/winaudioforensics.tests.ps1
      - run: python scripts/package.py
  bash-tools:
    name: Bash pipeline tools / Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install audio and shell dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg shellcheck
      - name: Bash syntax
        run: bash -n bash/*.sh bash/lib/*.sh
      - name: ShellCheck
        run: shellcheck -x -e SC1091 bash/*.sh bash/lib/*.sh
      - name: Bash regression suite
        run: python -m unittest tests.test_bash_pipeline_tools tests.test_bash_audit tests.test_bash_site -v
      - name: Build bundles
        run: python scripts/package.py
  browser:
    name: Browser workflows and responsive layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: python scripts/package.py
      - name: Run browser tests
        env:
          CDL_SCREENSHOT: browser-preview.png
        run: |
          python -m http.server 8000 --bind 127.0.0.1 --directory site > /tmp/cdl-server.log 2>&1 &
          node tests/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-preview
          path: browser-preview.png
          if-no-files-found: ignore
  publish:
    name: Publish GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [tools, bash-tools, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python scripts/package.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
